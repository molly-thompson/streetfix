<div class="uk-margin" data-field="{{ field.name }}">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="uk-form-label">{{ field }} {{ field.label }}</label>
  {% else %}
    <label class="uk-form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    <div class="uk-form-controls">{{ field }}</div>
  {% endif %}
  {% if field.help_text %}
    <div id="{{ field.auto_id }}_helptext" class="uk-text-meta">{{ field.help_text }}</div>
  {% endif %}
  {% if field.errors %}
    <div id="{{ field.auto_id }}_error" class="uk-text-danger">{{ field.errors }}</div>
  {% endif %}
</div>
