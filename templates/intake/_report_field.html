<div class="ui-field" data-field="{{ field.name }}">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="ui-label">{{ field }} {{ field.label }}</label>
  {% else %}
    <label class="ui-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    <div class="ui-field__control">{{ field }}</div>
  {% endif %}
  {% if field.help_text %}
    <div id="{{ field.auto_id }}_helptext" class="ui-help">{{ field.help_text }}</div>
  {% endif %}
  {% if field.errors %}
    <div id="{{ field.auto_id }}_error" class="ui-error">{{ field.errors }}</div>
  {% endif %}
</div>
