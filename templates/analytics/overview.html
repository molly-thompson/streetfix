{% extends "base.html" %}

{% block title %}Analytics Overview | {{ site_name }}{% endblock title %}

{% block content %}
  <section class="sf-stack">
    <div class="sf-page-header">
      <h1>Analytics overview</h1>
      <p>Welcome to the Analytics Overview</p>
    </div>

    <div class="sf-card">
      <div class="sf-card__body">
        <div class="sf-analytics-grid">
          <article class="sf-metric sf-metric--primary">
            <h2>Total Views</h2>
            <p class="sf-metric__value">0</p>
          </article>
          <article class="sf-metric sf-metric--success">
            <h2>Conversions</h2>
            <p class="sf-metric__value">0</p>
          </article>
          <article class="sf-metric sf-metric--warning">
            <h2>Revenue</h2>
            <p class="sf-metric__value">$0</p>
          </article>
          <article class="sf-metric sf-metric--secondary">
            <h2>Users</h2>
            <p class="sf-metric__value">0</p>
          </article>
        </div>
      </div>
    </div>
  </section>
{% endblock content %}
