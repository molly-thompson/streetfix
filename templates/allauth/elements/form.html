{% load allauth %}

{% comment %} djlint:off {% endcomment %}
<form method="{{ attrs.method }}" class="ui-form ui-stack"
      {% if attrs.action %}action="{{ attrs.action }}"{% endif %}>
    {% slot body %}
    {% endslot %}
    <div class="ui-form__actions">
        {% slot actions %}
        {% endslot %}
    </div>
</form>
