{% load allauth %}

{% comment %} djlint:off {% endcomment %}
<form method="{{ attrs.method }}" class="sf-form sf-stack"
      {% if attrs.action %}action="{{ attrs.action }}"{% endif %}>
    {% slot body %}
    {% endslot %}
    <div class="sf-form__actions">
        {% slot actions %}
        {% endslot %}
    </div>
</form>
