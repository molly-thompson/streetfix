[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triage-decision-engine"
version = "0.1.0"
description = "Independent, configurable AI-assisted triage decision-support engine with deterministic safety safeguards and verifiable evidence attribution."
readme = "README.md"
# Targets Python 3.14.x deployments while remaining compatible with Python 3.11.2+ runtimes.
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "google-genai>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["triage_engine*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: Live Gemini API integration tests requiring GEMINI_API_KEY and RUN_LIVE_AI_TESTS=1",
]
